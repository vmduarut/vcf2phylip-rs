[package]
name = "vcf2phylip-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "VCF/BCF inspection and memory/disk FASTA/relaxed PHYLIP conversion"
license = "GPL-3.0-only"
readme = "README.md"
include = ["Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "src/**", "tests/**", "examples/**", "scripts/*.py", "docs/**", "packaging/**", "Dockerfile", ".dockerignore"]

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
flate2 = "=1.1.11"
noodles = { version = "=0.119.0", features = ["vcf", "bcf", "bgzf"] }
rand_chacha = "=0.10.0"
thiserror = "=2.0.21"
tempfile = "=3.27.0"
